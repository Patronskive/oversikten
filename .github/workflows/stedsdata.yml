name: Stedsdata

on:
  workflow_dispatch:
    inputs:
      steg:
        description: Hva skal kjøres
        type: choice
        default: alt
        options: [alt, tabeller, rutenett]

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Installer pakker
        run: pip install -r requirements.txt
      - name: Kartlegg SSB-tabeller
        if: inputs.steg == 'alt' || inputs.steg == 'tabeller'
        run: python ssb_tabeller.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Befolkning på 250 m-rutenett
        if: inputs.steg == 'alt' || inputs.steg == 'rutenett'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ssb_rutenett.py
