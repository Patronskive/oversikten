name: Stedsdata

on:
  workflow_dispatch:
    inputs:
      steg:
        description: Hva skal kjøres
        type: choice
        default: alt
        options: [alt, rutenett, grunnkretser, statistikk, osm, reisetid, eksport, tabeller, meta]

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-java@v4
        if: inputs.steg == 'alt' || inputs.steg == 'reisetid'
        with:
          distribution: temurin
          java-version: "21"
      - name: Installer pakker
        run: pip install -r requirements.txt
      - name: Befolkning på 250 m-rutenett
        if: inputs.steg == 'alt' || inputs.steg == 'rutenett'
        run: python ssb_rutenett.py
      - name: Grunnkretser og delområder
        if: inputs.steg == 'alt' || inputs.steg == 'grunnkretser'
        run: python grunnkretser.py
      - name: SSB-statistikk (alder, inntekt, husholdninger)
        if: inputs.steg == 'alt' || inputs.steg == 'statistikk'
        run: python ssb_statistikk.py
      - name: Avstander fra OpenStreetMap
        if: inputs.steg == 'alt' || inputs.steg == 'osm'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL -o norway.osm.pbf https://download.geofabrik.de/europe/norway-latest.osm.pbf
          osmium extract -b 9.9,58.7,12.6,60.55 norway.osm.pbf -o region.osm.pbf --overwrite
          rm norway.osm.pbf
          python osm_avstander.py region.osm.pbf
      - name: Reisetid med kollektiv
        if: inputs.steg == 'alt' || inputs.steg == 'reisetid'
        run: |
          if [ ! -f region.osm.pbf ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
            curl -sSfL -o norway.osm.pbf https://download.geofabrik.de/europe/norway-latest.osm.pbf
            osmium extract -b 9.9,58.7,12.6,60.55 norway.osm.pbf -o region.osm.pbf --overwrite
            rm norway.osm.pbf
          fi
          curl -sSfL -o gtfs.zip https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_norway-aggregated-gtfs.zip
          python reisetid.py region.osm.pbf gtfs.zip --max-memory 13G
      - name: Eksporter data til appen
        if: inputs.steg == 'alt' || inputs.steg == 'eksport'
        run: |
          python eksport.py ../data/stedsdata.json
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stedsdata.json
          git diff --cached --quiet || (git commit -m "Oppdater stedsdata" && git push)
      - name: Kartlegg SSB-tabeller
        if: inputs.steg == 'tabeller'
        run: python ssb_tabeller.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Struktur for SSB-tabeller og grunnkrets-WFS
        if: inputs.steg == 'meta'
        run: python ssb_meta.py
