<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Johans guide</title>
<meta name="theme-color" content="#0d0f1a">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f1a;--surface:#161929;--surface2:#1e2235;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e4e7f2;--muted:#5a6080;
  --accent:#5b7fff;--accent-dim:rgba(91,127,255,0.15);--accent-border:rgba(91,127,255,0.35);
  --success:#34d399;--warn:#fbbf24;--danger:#f87171;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100vh;}
.header{padding:20px 18px 0;background:linear-gradient(170deg,#12162a 0%,var(--bg) 100%);flex-shrink:0;}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:5px;}
.place{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;}
.place span{font-size:13px;font-weight:400;color:var(--muted);display:block;margin-top:3px;}
.weather-badge{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:10px 14px;text-align:center;flex-shrink:0;width:80px;display:none;}
.wb-icon{font-size:26px;line-height:1;}
.wb-temp{font-size:19px;font-weight:700;margin-top:3px;}
.wb-wind{font-size:10px;color:var(--muted);margin-top:2px;}
.wb-uv{font-size:10px;margin-top:2px;font-weight:600;display:none;}
.hour-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none;}
.hour-strip::-webkit-scrollbar{display:none;}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 9px;text-align:center;flex-shrink:0;min-width:50px;}
.hcard.now{background:var(--accent-dim);border-color:var(--accent-border);}
.ht{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:3px;}
.hcard.now .ht{color:var(--accent);}
.hi{font-size:17px;}
.htemp{font-size:13px;font-weight:600;margin-top:3px;}
.hrain{font-size:10px;color:#60a5fa;margin-top:2px;}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:20;flex-shrink:0;}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s;}
.tab.active{border-bottom-color:var(--accent);color:var(--accent);}
.content{flex:1;padding:14px 16px 90px;overflow-y:auto;}
.dep{background:var(--surface);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;border:1px solid var(--border);margin-bottom:7px;}
.dep.soon{border-color:var(--accent-border);}
.lbadge{background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:800;flex-shrink:0;min-width:50px;text-align:center;}
.dep.soon .lbadge{background:var(--accent-dim);border-color:var(--accent-border);color:#a5b4fc;}
.dep-dest{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dep-stop{font-size:11px;color:var(--muted);margin-top:2px;}
.dep-right{text-align:right;flex-shrink:0;}
.dep-mins{font-size:15px;font-weight:800;}
.dep.soon .dep-mins{color:#818cf8;}
.dep-clock{font-size:11px;color:var(--muted);}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.rcard-body{padding:13px 14px;}
.rcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
.rcard-name{font-size:15px;font-weight:700;line-height:1.2;}
.rcard-type{font-size:12px;color:var(--muted);margin-bottom:6px;}
.rcard-hours{font-size:12px;display:flex;align-items:center;gap:5px;}
.open{color:var(--success);font-weight:600;}
.closed{color:var(--danger);font-weight:600;}
.empty{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;text-align:center;color:var(--muted);}
.eicon{font-size:36px;margin-bottom:10px;}
.spinner{text-align:center;padding:52px;color:var(--muted);}
.sicon{font-size:36px;margin-bottom:12px;animation:spin 1.2s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
.errcard{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:14px;padding:20px;text-align:center;margin-bottom:12px;}
.etitle{color:var(--danger);font-weight:700;margin-bottom:6px;}
.ebody{font-size:13px;color:var(--muted);line-height:1.5;}
.fab{position:fixed;bottom:22px;right:18px;background:var(--accent);border:none;border-radius:50%;width:52px;height:52px;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(91,127,255,.45);z-index:30;}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 18px 18px;background:linear-gradient(0deg,var(--bg) 60%,transparent);display:flex;justify-content:space-between;align-items:center;z-index:25;pointer-events:none;}
.loc-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;pointer-events:all;}
.stopcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.stopcard-name{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-weight:700;font-size:15px;}
.stop-dot{background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.minidep{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg);border-radius:9px;margin-bottom:5px;}
.minidep:last-child{margin-bottom:0;}
.minibadge{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;flex-shrink:0;}
.minidest{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b0b4c8;}
.minitime{font-size:12px;font-weight:800;flex-shrink:0;}
.slabel{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px;margin-top:4px;}
.radius-bar{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.radius-label{font-size:11px;color:var(--muted);}
.rbtn{background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;padding:5px 12px;}
.rbtn.active{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div>
      <div class="eyebrow">Johans guide</div>
      <div class="place" id="place-name">Henter posisjon…<span id="place-sub"></span></div>
    </div>
    <div class="weather-badge" id="weather-badge">
      <div class="wb-icon" id="wb-icon"></div>
      <div class="wb-temp" id="wb-temp"></div>
      <div class="wb-wind" id="wb-wind"></div>
      <div class="wb-uv" id="wb-uv"></div>
    </div>
  </div>
  <div class="hour-strip" id="hour-strip"></div>
</div>
<div class="tabs">
  <button class="tab active" onclick="setTab('kollektiv')" id="tab-kollektiv"><i class="ti ti-bus"></i>Kollektiv</button>
  <button class="tab" onclick="setTab('mikro')" id="tab-mikro"><i class="ti ti-scooter"></i>Mikro</button>
  <button class="tab" onclick="setTab('mat')" id="tab-mat"><i class="ti ti-tools-kitchen-2"></i>Spise</button>
  <button class="tab" onclick="setTab('utforsk')" id="tab-utforsk"><i class="ti ti-compass"></i>Utforsk</button>
  <button class="tab" onclick="setTab('handel')" id="tab-handel"><i class="ti ti-shopping-cart"></i>Handel</button>
</div>
<div class="content" id="content">
  <div class="spinner"><span class="sicon">⟳</span><div>Henter posisjon…</div></div>
</div>
<div class="bottom-bar">
  <div class="loc-label" id="loc-label"></div>
</div>
<button class="fab" id="fab" style="display:none" onclick="refresh()">↻</button>

<script>
// ── Constants ──────────────────────────────────────────────
const WI={clearsky:"☀️",fair:"🌤️",partlycloudy:"⛅",cloudy:"☁️",rainshowers:"🌦️",rain:"🌧️",heavyrain:"🌧️",snow:"❄️",sleet:"🌨️",fog:"🌫️",thunder:"⛈️"};
const MI={bus:"🚌",tram:"🚊",rail:"🚆",metro:"🚇",water:"⛴️",ferry:"⛴️"};

// ── State ──────────────────────────────────────────────────
let loc=null, weather=null;
let departures=[], stops=[], bikes=[], scooters=[];
let restaurants=[], attractions=[], shops=[];
let fetchingRestaurants=false, restaurantsFetched=false;
let fetchingAttractions=false, attractionsFetched=false;
let fetchingShops=false, shopsFetched=false;
let curTab="kollektiv", transitRadius=300;

// ── Helpers ────────────────────────────────────────────────
function wi(s){if(!s)return"🌤️";const k=Object.keys(WI).find(k=>s.toLowerCase().includes(k));return k?WI[k]:"🌤️";}
function mi(m){return MI[m?.toLowerCase()]||"🚌";}
function fmt(iso){if(!iso)return"";return new Date(iso).toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"});}
function mins(iso){if(!iso)return"–";const d=Math.round((new Date(iso)-Date.now())/60000);if(d<=0)return"nå";return d===1?"1 min":`${d} min`;}
function calcDist(lat1,lon1,lat2,lon2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function setContent(html){document.getElementById("content").innerHTML=html;}
function fetchWithTimeout(url,options={},ms=8000){
  const c=new AbortController();
  const id=setTimeout(()=>c.abort(),ms);
  return fetch(url,{...options,signal:c.signal}).finally(()=>clearTimeout(id));
}

// ── Geolocation ────────────────────────────────────────────
function initLoc(){
  if(!navigator.geolocation){showErr("Nettleseren støtter ikke lokasjon.");return;}
  navigator.geolocation.getCurrentPosition(
    async p=>{
      loc={lat:p.coords.latitude,lon:p.coords.longitude};
      document.getElementById("fab").style.display="flex";
      document.getElementById("place-name").childNodes[0].textContent="Din lokasjon";
      document.getElementById("loc-label").innerHTML=`📍 ${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}`;
      fetchWithTimeout(`https://nominatim.openstreetmap.org/reverse?lat=${loc.lat}&lon=${loc.lon}&format=json`,{headers:{"User-Agent":"Johans guide/1.0"}},5000)
        .then(r=>r.json()).then(d=>{
          const nb=d.address?.neighbourhood||d.address?.suburb||d.address?.city_district||"";
          const city=d.address?.city||d.address?.town||"";
          document.getElementById("place-name").childNodes[0].textContent=nb||city||"Din lokasjon";
          document.getElementById("place-sub").textContent=nb&&city?city:"";
          document.getElementById("loc-label").innerHTML=`📍 ${nb||city||"Din lokasjon"}`;
        }).catch(()=>{});
      fetchAll();
    },
    ()=>showErr("Tillat lokasjon i nettleseren og last siden på nytt."),
    {enableHighAccuracy:true,timeout:12000}
  );
}

function showErr(msg){
  document.getElementById("place-name").childNodes[0].textContent="Ingen posisjon";
  setContent(`<div class="errcard"><div class="etitle">📍 Lokasjonstilgang mangler</div><div class="ebody">${msg}</div></div>`);
}

// ── Fetch functions ────────────────────────────────────────
async function fetchWeather(){
  if(!loc)return;
  try{
    const r=await fetchWithTimeout(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${loc.lat.toFixed(4)}&lon=${loc.lon.toFixed(4)}`,{headers:{"User-Agent":"Johans guide/1.0"}},8000);
    const d=await r.json();
    weather={current:d.properties?.timeseries?.[0],hours:d.properties?.timeseries?.slice(0,13)||[]};
    weather.uv=weather.current?.data?.instant?.details?.ultraviolet_index_clear_sky??null;
    renderHeader();
  }catch(e){console.error("Weather error",e);}
}

async function fetchTransit(){
  if(!loc)return;
  const pad=transitRadius===300?0.008:transitRadius===500?0.012:transitRadius===1000?0.018:0.03;
  const q=`{stopPlacesByBbox(minimumLatitude:${loc.lat-pad},maximumLatitude:${loc.lat+pad},minimumLongitude:${loc.lon-pad},maximumLongitude:${loc.lon+pad}){id name latitude longitude estimatedCalls(timeRange:3600,numberOfDepartures:10){expectedDepartureTime destinationDisplay{frontText}serviceJourney{line{publicCode transportMode}}}}}`;
  try{
    const r=await fetchWithTimeout("https://api.entur.io/journey-planner/v3/graphql",{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":"johansguide-app"},body:JSON.stringify({query:q})},8000);
    const data=await r.json();
    const raw=(data.data?.stopPlacesByBbox||[])
      .filter(s=>s.estimatedCalls?.length&&s.latitude)
      .map(s=>({...s,dist:Math.round(calcDist(loc.lat,loc.lon,s.latitude,s.longitude))}))
      .sort((a,b)=>a.dist-b.dist);
    const maxStops=transitRadius<=300?3:transitRadius<=500?5:8;
    const filtered=raw.filter(s=>s.dist<=transitRadius);
    const nearest=filtered.length?filtered.slice(0,maxStops):raw.slice(0,3);
    const all=[];
    raw.forEach(s=>s.estimatedCalls.forEach(c=>all.push({stop:s.name,dist:s.dist,time:c.expectedDepartureTime,dest:c.destinationDisplay?.frontText,line:c.serviceJourney?.line?.publicCode,mode:c.serviceJourney?.line?.transportMode})));
    all.sort((a,b)=>new Date(a.time)-new Date(b.time));
    departures=all.filter(d=>nearest.some(s=>s.name===d.stop)).slice(0,40);
    stops=nearest;
    if(curTab==="kollektiv")renderContent();
  }catch(e){
    console.error("Transit error",e);
    if(curTab==="kollektiv")setContent(`<div class="errcard"><div class="etitle">Kunne ikke hente avganger</div><div class="ebody">Prøv igjen.</div></div>`);
  }
}

async function fetchBikes(){
  if(!loc)return;
  try{
    const [ir,sr]=await Promise.all([
      fetchWithTimeout("https://gbfs.urbansharing.com/oslobysykkel.no/station_information.json",{headers:{"Client-Identifier":"johansguide-app"}},6000),
      fetchWithTimeout("https://gbfs.urbansharing.com/oslobysykkel.no/station_status.json",{headers:{"Client-Identifier":"johansguide-app"}},6000)
    ]);
    const info=await ir.json(), status=await sr.json();
    const sm={};
    (status.data?.stations||[]).forEach(s=>sm[s.station_id]=s);
    bikes=(info.data?.stations||[])
      .map(s=>({name:s.name,dist:Math.round(calcDist(loc.lat,loc.lon,s.lat,s.lon)),bikes:sm[s.station_id]?.num_bikes_available??0,docks:sm[s.station_id]?.num_docks_available??0}))
      .filter(s=>s.dist<=1000).sort((a,b)=>a.dist-b.dist).slice(0,5);
    if(curTab==="mikro")renderContent();
  }catch(e){console.error("Bikes error",e);}
}

async function fetchScooters(){
  if(!loc)return;
  try{
    const q=`{vehicles(lat:${loc.lat},lon:${loc.lon},range:1000,count:100,includeReserved:false,includeDisabled:false){id lat lon currentFuelPercent vehicleType{formFactor}system{name{translation{value}}}}}`;
    const r=await fetchWithTimeout("https://api.entur.io/mobility/v2/graphql",{
      method:"POST",
      headers:{"Content-Type":"application/json","ET-Client-Name":"johansguide-app"},
      body:JSON.stringify({query:q})
    },6000);
    const data=await r.json();
    if(data.errors){console.error("Scooter errors",data.errors);return;}
    const nameMap={"Ryde_Oslo":"Ryde","Bolt Technology OÜ":"Bolt","Bolt Technology":"Bolt","VOI":"Voi","Tier Mobility":"Tier","Dott":"Dott"};
    const ops={};
    (data.data?.vehicles||[]).forEach(v=>{
      const rawName=v.system?.name?.translation?.[0]?.value||"Ukjent";
      const op=nameMap[rawName]||rawName.replace(/_/g," ").trim();
      const form=v.vehicleType?.formFactor||"";
      const icon=form==="BICYCLE"||form==="CARGO_BICYCLE"?"🚲":form==="MOPED"?"🛵":"🛴";
      const d=Math.round(calcDist(loc.lat,loc.lon,v.lat,v.lon));
      if(!ops[op])ops[op]={name:op,icon,count:0,closest:9999,vehicles:[]};
      ops[op].count++;
      if(d<ops[op].closest)ops[op].closest=d;
      const bat=v.currentFuelPercent!=null?(v.currentFuelPercent<=1?Math.round(v.currentFuelPercent*100):Math.round(v.currentFuelPercent)):null;
      ops[op].vehicles.push({lat:v.lat,lon:v.lon,dist:d,battery:bat,icon});
    });
    Object.values(ops).forEach(op=>op.vehicles.sort((a,b)=>a.dist-b.dist));
    scooters=Object.values(ops).sort((a,b)=>a.closest-b.closest);
    if(curTab==="mikro")renderContent();
  }catch(e){console.error("Scooters error",e);}
}

let expandedOp=null, showMapOp=null;
function toggleOp(name){expandedOp=expandedOp===name?null:name;showMapOp=null;renderContent();}
function toggleMap(name){
  showMapOp=showMapOp===name?null:name;
  renderContent();
  if(showMapOp){setTimeout(()=>initOpMap(name),100);}
}
function initOpMap(name){
  const op=scooters.find(s=>s.name===name);
  if(!op||!op.vehicles.length)return;
  const mapId="map-"+name.replace(/[^a-z0-9]/gi,"-");
  const el=document.getElementById(mapId);
  if(!el)return;
  const center=op.vehicles[0];
  const bbox=0.003;
  const minLon=(center.lon-bbox).toFixed(5),minLat=(center.lat-bbox).toFixed(5),maxLon=(+center.lon+bbox).toFixed(5),maxLat=(+center.lat+bbox).toFixed(5);
  const markers=op.vehicles.slice(0,15).map(v=>`${v.lon},${v.lat}`).join("|");
  el.innerHTML=`<iframe width="100%" height="260" style="border:0;border-radius:10px" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${minLon},${minLat},${maxLon},${maxLat}&layer=mapnik&marker=${center.lat},${center.lon}"></iframe>
  <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
    ${op.vehicles.slice(0,8).map(v=>`<a href="https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lon}" target="_blank" style="background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:4px 10px;font-size:11px;color:var(--accent);text-decoration:none">${v.icon||"🛴"} ${v.dist}m${v.battery!=null?" · "+v.battery+"%":""}</a>`).join("")}
  </div>`;
}

async function fetchRestaurants(){
  if(!loc||fetchingRestaurants||restaurantsFetched)return;
  fetchingRestaurants=true;
  try{
    const r=await fetchWithTimeout("https://places.googleapis.com/v1/places:searchNearby",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":"AIzaSyAg9DDMoznsaUQAHKZ7toQ6HR7XhhEunmI","X-Goog-FieldMask":"places.displayName,places.rating,places.userRatingCount,places.priceLevel,places.currentOpeningHours,places.formattedAddress,places.location,places.primaryTypeDisplayName"},
      body:JSON.stringify({includedTypes:["restaurant","cafe","bar","bakery","meal_takeaway"],maxResultCount:15,rankPreference:"DISTANCE",locationRestriction:{circle:{center:{latitude:loc.lat,longitude:loc.lon},radius:800}}})
    },8000);
    const data=await r.json();
    if(data.error)throw new Error(data.error.message);
    restaurants=(data.places||[])
      .filter(p=>p.rating&&p.rating>=3.8&&p.userRatingCount>=5)
      .map(p=>({
        name:p.displayName?.text||"",type:p.primaryTypeDisplayName?.text||"",
        rating:p.rating||null,ratingCount:p.userRatingCount||null,price:p.priceLevel||null,
        open:p.currentOpeningHours?.openNow??null,address:p.formattedAddress||"",
        dist:Math.round(calcDist(loc.lat,loc.lon,p.location?.latitude||0,p.location?.longitude||0)),
      }))
      .sort((a,b)=>a.dist-b.dist);
    restaurantsFetched=true;
    if(curTab==="mat")renderContent();
  }catch(e){console.error("Restaurant error",e);if(curTab==="mat")setContent(`<div class="errcard"><div class="etitle">Feil</div><div class="ebody">${e.message}</div></div>`);}
  finally{fetchingRestaurants=false;}
}

async function fetchAttractions(){
  if(!loc||fetchingAttractions||attractionsFetched)return;
  fetchingAttractions=true;
  try{
    const r=await fetchWithTimeout("https://places.googleapis.com/v1/places:searchNearby",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":"AIzaSyAg9DDMoznsaUQAHKZ7toQ6HR7XhhEunmI","X-Goog-FieldMask":"places.displayName,places.rating,places.userRatingCount,places.formattedAddress,places.location,places.primaryTypeDisplayName,places.currentOpeningHours"},
      body:JSON.stringify({includedTypes:["museum","art_gallery","tourist_attraction","park","monument","aquarium","zoo","amusement_park","stadium","cultural_landmark","historical_place","national_park","performing_arts_theater","visitor_center"],maxResultCount:15,rankPreference:"DISTANCE",locationRestriction:{circle:{center:{latitude:loc.lat,longitude:loc.lon},radius:2000}}})
    },8000);
    const data=await r.json();
    if(data.error)throw new Error(data.error.message);
    attractions=(data.places||[]).filter(p=>p.rating>=3.5&&p.userRatingCount>=5).map(p=>({
      name:p.displayName?.text||"",type:p.primaryTypeDisplayName?.text||"",
      rating:p.rating||null,ratingCount:p.userRatingCount||null,
      open:p.currentOpeningHours?.openNow??null,address:p.formattedAddress||"",
      dist:Math.round(calcDist(loc.lat,loc.lon,p.location?.latitude||0,p.location?.longitude||0)),
    }));
    attractionsFetched=true;
    if(curTab==="utforsk")renderContent();
  }catch(e){console.error("Attractions error",e);if(curTab==="utforsk")setContent(`<div class="errcard"><div class="etitle">Feil</div><div class="ebody">${e.message}</div></div>`);}
  finally{fetchingAttractions=false;}
}

async function fetchShops(){
  if(!loc||fetchingShops||shopsFetched)return;
  fetchingShops=true;
  try{
    const r=await fetchWithTimeout("https://places.googleapis.com/v1/places:searchNearby",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":"AIzaSyAg9DDMoznsaUQAHKZ7toQ6HR7XhhEunmI","X-Goog-FieldMask":"places.displayName,places.rating,places.userRatingCount,places.formattedAddress,places.location,places.primaryTypeDisplayName,places.currentOpeningHours"},
      body:JSON.stringify({includedTypes:["grocery_store","supermarket","convenience_store","pharmacy","drugstore"],maxResultCount:15,rankPreference:"DISTANCE",locationRestriction:{circle:{center:{latitude:loc.lat,longitude:loc.lon},radius:1000}}})
    },8000);
    const data=await r.json();
    if(data.error)throw new Error(data.error.message);
    const excludeTypes=["Manufacturer","Wholesaler","Corporate Office","Distribution Service"];
    shops=(data.places||[])
      .filter(p=>{
        const t=p.primaryTypeDisplayName?.text||"";
        return !excludeTypes.includes(t);
      })
      .map(p=>({
        name:p.displayName?.text||"",type:p.primaryTypeDisplayName?.text||"",
        rating:p.rating||null,ratingCount:p.userRatingCount||null,
        open:p.currentOpeningHours?.openNow??null,address:p.formattedAddress||"",
        dist:Math.round(calcDist(loc.lat,loc.lon,p.location?.latitude||0,p.location?.longitude||0)),
      })).sort((a,b)=>a.dist-b.dist);
    shopsFetched=true;
    if(curTab==="handel")renderContent();
  }catch(e){console.error("Shops error",e);if(curTab==="handel")setContent(`<div class="errcard"><div class="etitle">Feil</div><div class="ebody">${e.message}</div></div>`);}
  finally{fetchingShops=false;}
}

// ── Orchestration ──────────────────────────────────────────
function fetchAll(){
  setContent(`<div class="spinner"><span class="sicon">⟳</span><div>Henter data…</div></div>`);
  weather=null;departures=[];stops=[];bikes=[];scooters=[];
  restaurants=[];attractions=[];shops=[];
  restaurantsFetched=false;attractionsFetched=false;shopsFetched=false;
  fetchWeather();fetchTransit();fetchBikes();fetchScooters();
}

function refresh(){
  fetchAll();
}

function setTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
  if(t==="mat"&&!restaurantsFetched&&!fetchingRestaurants&&loc)fetchRestaurants();
  else if(t==="utforsk"&&!attractionsFetched&&!fetchingAttractions&&loc)fetchAttractions();
  else if(t==="handel"&&!shopsFetched&&!fetchingShops&&loc)fetchShops();
  else renderContent();
}

function setRadius(r){
  transitRadius=r;
  departures=[];stops=[];
  renderContent();
  fetchTransit();
}

// ── Render header ──────────────────────────────────────────
function renderHeader(){
  if(!weather)return;
  const cur=weather.current?.data;
  const temp=cur?.instant?.details?.air_temperature;
  const sym=cur?.next_1_hours?.summary?.symbol_code||cur?.next_6_hours?.summary?.symbol_code;
  const wind=cur?.instant?.details?.wind_speed;
  const uv=weather.uv;
  if(temp!=null){
    const b=document.getElementById("weather-badge");
    b.style.display="block";
    document.getElementById("wb-icon").textContent=wi(sym);
    document.getElementById("wb-temp").textContent=Math.round(temp)+"°";
    document.getElementById("wb-wind").textContent=wind!=null?"💨 "+Math.round(wind)+" m/s":"";
    const uvEl=document.getElementById("wb-uv");
    if(uv!=null){
      const uvColor=uv===0?"#5a6080":uv<=2?"#34d399":uv<=5?"#fbbf24":uv<=7?"#f97316":"#f87171";
      uvEl.textContent="☀️ UV "+uv;
      uvEl.style.color=uvColor;
      uvEl.style.display="block";
    }
  }
  document.getElementById("hour-strip").innerHTML=weather.hours.map((ts,i)=>{
    const t=ts.data?.instant?.details?.air_temperature;
    const s=ts.data?.next_1_hours?.summary?.symbol_code;
    const p=ts.data?.next_1_hours?.details?.precipitation_amount;
    return `<div class="hcard${i===0?" now":""}"><div class="ht">${i===0?"nå":new Date(ts.time).toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"})}</div><div class="hi">${wi(s)}</div><div class="htemp">${Math.round(t)}°</div>${p>0?`<div class="hrain">${p}mm</div>`:""}</div>`;
  }).join("");
}

// ── Render content ─────────────────────────────────────────
function renderContent(){
  const c=document.getElementById("content");

  if(curTab==="kollektiv"){
    const rbar=`<div class="radius-bar"><span class="radius-label">Radius:</span><button class="rbtn${transitRadius===300?" active":""}" onclick="setRadius(300)">300m</button><button class="rbtn${transitRadius===500?" active":""}" onclick="setRadius(500)">500m</button><button class="rbtn${transitRadius===1000?" active":""}" onclick="setRadius(1000)">1 km</button><button class="rbtn${transitRadius===2000?" active":""}" onclick="setRadius(2000)">2 km</button></div>`;
    if(!stops.length){setContent(rbar+`<div class="spinner"><span class="sicon">⟳</span><div>Henter avganger…</div></div>`);return;}
    c.innerHTML=rbar+stops.map(stop=>{
      const stopDeps=departures.filter(d=>d.stop===stop.name).slice(0,7);
      return `<div class="stopcard">
        <div class="stopcard-name">
          <div class="stop-dot">📍</div>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.name+' stoppested')}" target="_blank" style="color:var(--text);text-decoration:none;flex:1">${stop.name} <i class="ti ti-external-link" style="font-size:12px;color:var(--muted)"></i></a>
          <span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:auto;flex-shrink:0">${stop.dist}m</span>
        </div>
        ${stopDeps.map(dep=>{
          const m=mins(dep.time),soon=m==="nå"||(typeof m==="string"&&parseInt(m)<=3);
          return `<div class="minidep">
            <span class="minibadge" style="${soon?"background:var(--accent-dim);border-color:var(--accent-border);color:#a5b4fc":""}">${mi(dep.mode)}${dep.line}</span>
            <span class="minidest">${dep.dest||"–"}</span>
            <span class="minitime" style="color:${soon?"#818cf8":"var(--muted)"}">${m}</span>
            <span style="font-size:11px;color:var(--muted);flex-shrink:0;margin-left:2px">${fmt(dep.time)}</span>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");

    } else if(curTab==="mikro"){
    let html="";
    if(bikes.length){
      html+=`<div class="slabel">Bysykkel</div>`;
      html+=bikes.map(b=>`<div class="dep"><div class="lbadge" style="font-size:18px">🚲</div><div style="flex:1;min-width:0"><div class="dep-dest">${b.name}</div><div class="dep-stop">${b.dist}m unna</div></div><div class="dep-right"><div class="dep-mins" style="color:${b.bikes>0?"var(--success)":"var(--danger)"}">${b.bikes}</div><div class="dep-clock">${b.docks} lås</div></div></div>`).join("");
    }
    if(scooters.length){
      html+=`<div class="slabel" style="margin-top:${bikes.length?16:0}px">Sparkesykler</div>`;
      html+=scooters.map(s=>{
        const isExp=expandedOp===s.name;
        const isMap=showMapOp===s.name;
        const mapId="map-"+s.name.replace(/\s/g,"-");
        let card=`<div class="stopcard" style="margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:11px;cursor:pointer" onclick="toggleOp('${s.name}')">
            <div class="lbadge" style="font-size:18px">${s.icon||"🛴"}</div>
            <div style="flex:1;min-width:0">
              <div class="dep-dest">${s.name}</div>
              <div class="dep-stop">Nærmeste: ${s.closest}m</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:15px;font-weight:800;color:var(--success)">${s.count}</div>
              <div style="font-size:11px;color:var(--muted)">tilgjengelig</div>
            </div>
            <div style="font-size:18px;color:var(--muted);margin-left:4px">${isExp?"▲":"▼"}</div>
          </div>`;
        if(isExp){
          card+=`<div style="margin-top:12px;display:flex;gap:8px;margin-bottom:10px">
            <button onclick="toggleMap('${s.name}')" style="flex:1;background:${isMap?"var(--accent-dim)":"var(--surface2)"};border:1px solid ${isMap?"var(--accent-border)":"var(--border2)"};border-radius:8px;color:${isMap?"var(--accent)":"var(--muted)"};cursor:pointer;font-size:12px;font-weight:600;padding:7px">🗺️ Kart</button>
          </div>`;
          if(isMap){
            card+=`<div id="${mapId}" style="margin-bottom:12px"><div style="text-align:center;padding:20px;color:var(--muted)">Laster kart…</div></div>`;
          }
          card+=`<div style="display:flex;flex-direction:column;gap:6px">`;
          s.vehicles.slice(0,8).forEach(v=>{
            const battColor=v.battery==null?"var(--muted)":v.battery>=60?"var(--success)":v.battery>=30?"var(--warn)":"var(--danger)";
            const battText=v.battery!=null?`🔋 ${v.battery}%`:"🔋 –";
            card+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:9px">
              <span style="font-size:18px">${v.icon||"🛴"}</span>
              <span style="flex:1;font-size:13px;color:var(--text)">${v.dist}m unna</span>
              ${v.battery!=null?`<span style="font-size:12px;font-weight:700;color:${battColor}">${battText}</span>`:""}
              <a href="https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lon}" target="_blank" style="font-size:12px;color:var(--accent);text-decoration:none">Gå dit</a>
            </div>`;
          });
          card+=`</div>`;
        }
        card+=`</div>`;
        return card;
      }).join("");
    }
    if(!bikes.length&&!scooters.length) html=`<div class="empty"><div class="eicon">🛴</div><div>Ingen mikromobilitet funnet</div></div>`;
    c.innerHTML=html;

  } else if(curTab==="mat"){
    if(!restaurantsFetched){setContent(`<div class="spinner"><span class="sicon">⟳</span><div>Henter restauranter…</div></div>`);return;}
    const pm={PRICE_LEVEL_INEXPENSIVE:"kr",PRICE_LEVEL_MODERATE:"kr kr",PRICE_LEVEL_EXPENSIVE:"kr kr kr",PRICE_LEVEL_VERY_EXPENSIVE:"kr kr kr kr"};
    c.innerHTML=`<div class="slabel">Nærmeste steder å spise</div>`+restaurants.map(r=>{
      const stars=r.rating?`<span style="color:#fbbf24">★</span> <strong>${r.rating.toFixed(1)}</strong> <span style="color:var(--muted);font-size:11px">(${r.ratingCount?.toLocaleString("no-NO")||0})</span>`:"";
      const price=r.price&&pm[r.price]?`<span style="color:var(--muted);margin-left:6px">${pm[r.price]}</span>`:"";
      const ob=r.open===true?`<span class="open">Åpent nå</span>`:r.open===false?`<span class="closed">Stengt</span>`:"";
      return `<div class="rcard"><div class="rcard-body"><div class="rcard-top"><a class="rcard-name" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name+' '+r.address)}" target="_blank" style="color:var(--text);text-decoration:none">${r.name} <i class="ti ti-external-link" style="font-size:12px;color:var(--muted)"></i></a><div style="font-size:11px;color:var(--muted)">📍 ${r.dist}m</div></div>${r.type?`<div class="rcard-type">${r.type}${price}</div>`:""}${stars?`<div style="font-size:13px;margin:4px 0">${stars}</div>`:""}${ob?`<div class="rcard-hours">${ob}</div>`:""}</div></div>`;
    }).join("");

  } else if(curTab==="utforsk"){
    if(!attractionsFetched){setContent(`<div class="spinner"><span class="sicon">⟳</span><div>Henter steder…</div></div>`);return;}
    c.innerHTML=`<div class="slabel">I nærheten (2 km)</div>`+attractions.map(r=>{
      const stars=r.rating?`<span style="color:#fbbf24">★</span> <strong>${r.rating.toFixed(1)}</strong> <span style="color:var(--muted);font-size:11px">(${r.ratingCount?.toLocaleString("no-NO")||0})</span>`:"";
      const ob=r.open===true?`<span class="open">Åpent nå</span>`:r.open===false?`<span class="closed">Stengt</span>`:"";
      return `<div class="rcard"><div class="rcard-body"><div class="rcard-top"><a class="rcard-name" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name+' '+r.address)}" target="_blank" style="color:var(--text);text-decoration:none">${r.name} <i class="ti ti-external-link" style="font-size:12px;color:var(--muted)"></i></a><div style="font-size:11px;color:var(--muted)">📍 ${r.dist}m</div></div>${r.type?`<div class="rcard-type">${r.type}</div>`:""}${stars?`<div style="font-size:13px;margin:4px 0">${stars}</div>`:""}${ob?`<div class="rcard-hours">${ob}</div>`:""}</div></div>`;
    }).join("");
  } else if(curTab==="handel"){
    if(!shopsFetched){setContent(`<div class="spinner"><span class="sicon">⟳</span><div>Henter butikker…</div></div>`);return;}
    if(!shops.length){setContent(`<div class="empty"><div class="eicon">🛒</div><div>Ingen butikker funnet i nærheten</div></div>`);return;}
    const typeIcon={"Grocery Store":"🛒","Supermarket":"🛒","Convenience Store":"🏪","Pharmacy":"💊","Drugstore":"💊"};
    const groceryTypes=["Grocery Store","Supermarket"];
    const pharmacyTypes=["Pharmacy","Drugstore"];
    const kioskTypes=["Convenience Store"];
    const grocery=shops.filter(s=>groceryTypes.includes(s.type));
    const pharmacy=shops.filter(s=>pharmacyTypes.includes(s.type));
    const kiosk=shops.filter(s=>kioskTypes.includes(s.type));
    const other=shops.filter(s=>!groceryTypes.includes(s.type)&&!pharmacyTypes.includes(s.type)&&!kioskTypes.includes(s.type));
    const renderShop=s=>{
      const ob=s.open===true?`<span class="open">Åpent nå</span>`:s.open===false?`<span class="closed">Stengt</span>`:"";
      const icon=typeIcon[s.type]||"🏪";
      return `<div class="rcard"><div class="rcard-body"><div class="rcard-top"><a class="rcard-name" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+s.address)}" target="_blank" style="color:var(--text);text-decoration:none">${icon} ${s.name} <i class="ti ti-external-link" style="font-size:12px;color:var(--muted)"></i></a><div style="font-size:11px;color:var(--muted)">📍 ${s.dist}m</div></div>${s.type?`<div class="rcard-type">${s.type}</div>`:""}${ob?`<div class="rcard-hours">${ob}</div>`:""}</div></div>`;
    };
    let html="";
    if(grocery.length){html+=`<div class="slabel">Dagligvare</div>`+grocery.map(renderShop).join("");}
    if(kiosk.length){html+=`<div class="slabel" style="margin-top:16px">Kiosk</div>`+kiosk.map(renderShop).join("");}
    if(pharmacy.length){html+=`<div class="slabel" style="margin-top:16px">Apotek</div>`+pharmacy.map(renderShop).join("");}
    if(other.length){html+=`<div class="slabel" style="margin-top:16px">Annet</div>`+other.map(renderShop).join("");}
    c.innerHTML=html;
  }
}

setInterval(()=>{if(loc&&curTab==="kollektiv")fetchTransit();},30000);
initLoc();
</script>
</body>
</html>
