<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Johans guide</title>
<meta name="theme-color" content="#0d0f1a">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f1a;
    --surface: #161929;
    --surface2: #1e2235;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e4e7f2;
    --muted: #5a6080;
    --accent: #5b7fff;
    --accent-dim: rgba(91,127,255,0.15);
    --accent-border: rgba(91,127,255,0.35);
    --success: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; min-height: 100vh; }

  /* HEADER */
  .header { padding: 20px 18px 0; background: linear-gradient(170deg, #12162a 0%, var(--bg) 100%); flex-shrink: 0; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .header-left .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .18em; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; }
  .header-left .place { font-size: 22px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
  .header-left .place span { font-size: 13px; font-weight: 400; color: var(--muted); display: block; margin-top: 3px; }
  .weather-badge { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 10px 14px; text-align: center; flex-shrink: 0; width: 80px; max-width: 80px; display: none; }
  .weather-badge .wb-icon { font-size: 26px; line-height: 1; }
  .weather-badge .wb-temp { font-size: 19px; font-weight: 700; margin-top: 3px; }
  .weather-badge .wb-wind { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* HOUR STRIP */
  .hour-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
  .hour-strip::-webkit-scrollbar { display: none; }
  .hcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; text-align: center; flex-shrink: 0; min-width: 50px; }
  .hcard.now { background: var(--accent-dim); border-color: var(--accent-border); }
  .hcard .ht { font-size: 10px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .hcard.now .ht { color: var(--accent); }
  .hcard .hi { font-size: 17px; }
  .hcard .htemp { font-size: 13px; font-weight: 600; margin-top: 3px; }
  .hcard .hrain { font-size: 10px; color: #60a5fa; margin-top: 2px; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 20; flex-shrink: 0; }
  .tab { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 600; padding: 11px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .15s; letter-spacing: .02em; }
  .tab.active { border-bottom-color: var(--accent); color: var(--accent); }
  .tab .ti { font-size: 19px; }

  /* CONTENT */
  .content { flex: 1; padding: 14px 16px 90px; overflow-y: auto; }

  /* DEPARTURE CARDS */
  .dep { background: var(--surface); border-radius: 13px; padding: 12px 14px; display: flex; align-items: center; gap: 11px; border: 1px solid var(--border); margin-bottom: 7px; transition: border-color .2s; }
  .dep.soon { border-color: var(--accent-border); }
  .lbadge { background: var(--surface2); border: 1px solid var(--border2); border-radius: 9px; padding: 5px 9px; font-size: 12px; font-weight: 800; flex-shrink: 0; min-width: 50px; text-align: center; }
  .dep.soon .lbadge { background: var(--accent-dim); border-color: var(--accent-border); color: #a5b4fc; }
  .dep-dest { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dep-stop { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .dep-right { text-align: right; flex-shrink: 0; }
  .dep-mins { font-size: 15px; font-weight: 800; }
  .dep.soon .dep-mins { color: #818cf8; }
  .dep-clock { font-size: 11px; color: var(--muted); }

  /* STOP CARDS */
  .stopcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .stopcard-name { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; font-weight: 700; font-size: 15px; }
  .stop-dot { background: var(--accent-dim); border: 1px solid var(--accent-border); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
  .minidep { display: flex; align-items: center; gap: 9px; padding: 7px 9px; background: var(--bg); border-radius: 9px; margin-bottom: 5px; }
  .minidep:last-child { margin-bottom: 0; }
  .minibadge { background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 800; flex-shrink: 0; }
  .minidest { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #b0b4c8; }
  .minitime { font-size: 12px; font-weight: 800; color: #818cf8; flex-shrink: 0; }

  /* WEATHER */
  .wcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .wcard-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 12px; }
  .whero { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .wbig { font-size: 52px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .wstats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
  .wstat { background: var(--bg); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .wstat-icon { font-size: 20px; margin-bottom: 3px; }
  .wstat-val { font-size: 14px; font-weight: 700; }
  .wstat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .frow { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .frow:last-child { border-bottom: none; }
  .ftime { font-size: 12px; color: var(--muted); width: 36px; flex-shrink: 0; }
  .ficon { font-size: 20px; flex-shrink: 0; }
  .fdetail { flex: 1; font-size: 11px; color: var(--muted); }
  .ftemp { font-size: 14px; font-weight: 700; }

  /* RESTAURANT CARDS */
  .rcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 10px; display: flex; flex-direction: column; }
  .rcard-body { padding: 13px 14px; }
  .rcard-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .rcard-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .rcard-rating { background: var(--accent-dim); border: 1px solid var(--accent-border); border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 700; color: #a5b4fc; flex-shrink: 0; }
  .rcard-type { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .rcard-hours { font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .rcard-hours .open { color: var(--success); font-weight: 600; }
  .rcard-hours .closed { color: var(--danger); font-weight: 600; }

  /* EMPTY / SPINNER */
  .empty { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; text-align: center; color: var(--muted); }
  .empty .eicon { font-size: 36px; margin-bottom: 10px; }
  .spinner { text-align: center; padding: 52px; color: var(--muted); }
  .spinner .sicon { font-size: 36px; margin-bottom: 12px; animation: spin 1.2s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* FAB */
  .fab { position: fixed; bottom: 22px; right: 18px; background: var(--accent); border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 21px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(91,127,255,.45); z-index: 30; }

  /* ERROR */
  .errcard { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 12px; }
  .errcard .etitle { color: var(--danger); font-weight: 700; margin-bottom: 6px; }
  .errcard .ebody { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .radius-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
  .radius-btn{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;padding:6px 12px;transition:all .15s}
  .radius-btn.active-radius{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}
  .radius-label{font-size:11px;color:var(--muted);margin-right:4px}
  /* BOTTOM BAR */
  .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 10px 18px 18px; background: linear-gradient(0deg, var(--bg) 60%, transparent); display: flex; justify-content: space-between; align-items: center; z-index: 25; pointer-events: none; }
  .loc-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; pointer-events: all; }
  .loc-label span { color: var(--text); font-weight: 500; }

  /* SECTION LABEL */
  .slabel { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 10px; margin-top: 4px; }
</style>

<body>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div class="eyebrow">Johans guide</div>
      <div class="place" id="place-name">Henter posisjon…<span id="place-sub"></span></div>
    </div>
    <div class="weather-badge" id="weather-badge">
      <div class="wb-icon" id="wb-icon"></div>
      <div class="wb-temp" id="wb-temp"></div>
      <div class="wb-wind" id="wb-wind"></div>
      <div id="wb-uv" style="display:none;font-size:10px;margin-top:2px;font-weight:600"></div>
    </div>
  </div>
  <div style="display:flex;gap:8px;padding-bottom:10px;flex-wrap:wrap" id="indicator-bar"></div>
  <div class="hour-strip" id="hour-strip"></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setTab('kollektiv')" id="tab-kollektiv"><i class="ti ti-bus ti"></i>Kollektiv</button>
  <button class="tab" onclick="setTab('mikro')" id="tab-mikro"><i class="ti ti-scooter ti"></i>Mikro</button>
  <button class="tab" onclick="setTab('mat')" id="tab-mat"><i class="ti ti-tools-kitchen-2 ti"></i>Spise</button>
  <button class="tab" onclick="setTab('utforsk')" id="tab-utforsk"><i class="ti ti-compass ti"></i>Utforsk</button>
</div>

<div class="content" id="content">
  <div class="spinner"><span class="sicon">⟳</span><div>Henter posisjon…</div></div>
</div>

<div class="bottom-bar">
  <div class="loc-label" id="loc-label"></div>
</div>
<button class="fab" id="fab" style="display:none" onclick="refresh()" aria-label="Oppdater">↻</button>

<script>
const WI={clearsky:"☀️",fair:"🌤️",partlycloudy:"⛅",cloudy:"☁️",rainshowers:"🌦️",rain:"🌧️",heavyrain:"🌧️",snow:"❄️",sleet:"🌨️",fog:"🌫️",thunder:"⛈️"};
const MI={bus:"🚌",tram:"🚊",rail:"🚆",metro:"🚇",water:"⛴️",ferry:"⛴️"};

function fetchWithTimeout(url, options={}, ms=8000){
  const controller=new AbortController();
  const id=setTimeout(()=>controller.abort(),ms);
  return fetch(url,{...options,signal:controller.signal}).finally(()=>clearTimeout(id));
}

async function fetchBikes(){
  if(!loc)return;
  try{
    const [infoRes, statusRes] = await Promise.all([
      fetchWithTimeout("https://gbfs.urbansharing.com/oslobysykkel.no/station_information.json",{headers:{"Client-Identifier":"johansguide-app"}},6000),
      fetchWithTimeout("https://gbfs.urbansharing.com/oslobysykkel.no/station_status.json",{headers:{"Client-Identifier":"johansguide-app"}},6000)
    ]);
    const info = await infoRes.json();
    const status = await statusRes.json();
    const statusMap={};
    (status.data?.stations||[]).forEach(s=>statusMap[s.station_id]=s);
    bikes=(info.data?.stations||[])
      .map(s=>({
        id:s.station_id,
        name:s.name,
        lat:s.lat, lon:s.lon,
        dist:Math.round(calcDist(loc.lat,loc.lon,s.lat,s.lon)),
        bikes:statusMap[s.station_id]?.num_bikes_available??0,
        docks:statusMap[s.station_id]?.num_docks_available??0,
      }))
      .filter(s=>s.dist<=1000)
      .sort((a,b)=>a.dist-b.dist)
      .slice(0,5);
  }catch(e){console.error("Bikes error",e);}
}

async function fetchScooters(){
  if(!loc)return;
  try{
    const q=`{
      vehicles(lat:${loc.lat},lon:${loc.lon},range:500,count:50,includeReserved:false,includeDisabled:false){
        id lat lon
        currentFuelPercent
        vehicleType{formFactor propulsionType}
        system{name{translation{value}}}
      }
    }`;
    const r=await fetchWithTimeout("https://api.entur.io/mobility/v2/graphql",{
      method:"POST",
      headers:{"Content-Type":"application/json","ET-Client-Name":"johansguide-app"},
      body:JSON.stringify({query:q})
    },6000);
    const data=await r.json();
    if(data.errors){console.error("Scooter errors:",JSON.stringify(data.errors));return;}
    const vehicles=data.data?.vehicles||[];
    const ops={};
    vehicles.forEach(v=>{
      const op=v.system?.name?.translation?.[0]?.value||"Ukjent";
      const form=v.vehicleType?.formFactor||"";
      const icon=form==="BICYCLE"?"🚲":form==="MOPED"?"🛵":form==="CARGO_BICYCLE"?"🚲":"🛴";
      if(!ops[op])ops[op]={name:op,icon,count:0,closest:9999};
      ops[op].count++;
      const d=Math.round(calcDist(loc.lat,loc.lon,v.lat,v.lon));
      if(d<ops[op].closest)ops[op].closest=d;
    });
    scooters=Object.values(ops).sort((a,b)=>a.closest-b.closest);
    if(curTab==="avg")renderContent();
  }catch(e){console.error("Scooters error",e);}
}
function wi(s){if(!s)return"🌤️";const k=Object.keys(WI).find(k=>s.toLowerCase().includes(k));return k?WI[k]:"🌤️";}
function mi(m){return MI[m?.toLowerCase()]||"🚌";}
function fmt(iso){if(!iso)return"";return new Date(iso).toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"});}
function minsUntil(iso){if(!iso)return"–";const d=Math.round((new Date(iso)-Date.now())/60000);if(d<=0)return"nå";return d===1?"1 min":`${d} min`;}
function isOpenNow(hours){
  if(!hours||!hours.length)return null;
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const today=days[new Date().getDay()];
  const line=hours.find(h=>h.startsWith(today));
  if(!line||line.includes("Closed"))return false;
  const m=line.match(/(\d+):(\d+)\s*(AM|PM)\s*[–-]\s*(\d+):(\d+)\s*(AM|PM)/i);
  if(!m)return null;
  const to24=(h,min,ap)=>{let hh=parseInt(h);if(ap.toUpperCase()==="PM"&&hh!==12)hh+=12;if(ap.toUpperCase()==="AM"&&hh===12)hh=0;return hh*60+parseInt(min);};
  const now=new Date().getHours()*60+new Date().getMinutes();
  const open=to24(m[1],m[2],m[3]),close=to24(m[4],m[5],m[6]);
  return now>=open&&now<close;
}
function todayHours(hours){
  if(!hours||!hours.length)return"";
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const today=days[new Date().getDay()];
  const line=hours.find(h=>h.startsWith(today));
  if(!line)return"";
  return line.replace(today+": ","");
}

let loc=null, weather=null, departures=[], stops=[], restaurants=[], attractions=[], bikes=[], scooters=[], curTab="kollektiv", transitRadius=300;
let fetchingAttractions=false;
let attractionsFetched=false;

// Geolocation
function initLoc(){
  if(!navigator.geolocation){showLocError("Nettleseren støtter ikke lokasjon.");return;}
  navigator.geolocation.getCurrentPosition(
    async p=>{
      loc={lat:p.coords.latitude,lon:p.coords.longitude};
      document.getElementById("fab").style.display="flex";
      // Reverse geocode via nominatim
      document.getElementById("place-name").childNodes[0].textContent="Din lokasjon";
      document.getElementById("loc-label").innerHTML=`<i class="ti ti-map-pin" style="font-size:13px"></i> ${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}`;
      // Reverse geocode in background, non-blocking
      fetchWithTimeout(`https://nominatim.openstreetmap.org/reverse?lat=${loc.lat}&lon=${loc.lon}&format=json`,{headers:{"User-Agent":"Johans guide/1.0"}},5000)
        .then(r=>r.json()).then(d=>{
          const nb=d.address?.neighbourhood||d.address?.suburb||d.address?.city_district||"";
          const city=d.address?.city||d.address?.town||"";
          document.getElementById("place-name").childNodes[0].textContent=nb||city||"Din lokasjon";
          document.getElementById("place-sub").textContent=nb&&city?city:"";
          document.getElementById("loc-label").innerHTML=`<i class="ti ti-map-pin" style="font-size:13px"></i> ${nb||city||"Din lokasjon"}`;
        }).catch(()=>{});
      fetchAll();
    },
    e=>{showLocError("Tillat lokasjon i nettleseren og last siden på nytt.");},
    {enableHighAccuracy:true,timeout:12000}
  );
}

function showLocError(msg){
  document.getElementById("place-name").childNodes[0].textContent="Ingen posisjon";
  document.getElementById("content").innerHTML=`<div class="errcard"><div class="etitle">📍 Lokasjonstilgang mangler</div><div class="ebody">${msg}</div></div>`;
}

async function fetchWeather(){
  if(!loc)return;
  try{
    const r=await fetchWithTimeout(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${loc.lat.toFixed(4)}&lon=${loc.lon.toFixed(4)}`,{headers:{"User-Agent":"Johans guide/1.0"}},8000);
    const d=await r.json();
    weather={current:d.properties?.timeseries?.[0],hours:d.properties?.timeseries?.slice(0,13)||[]};
    const uv=weather.current?.data?.instant?.details?.ultraviolet_index_clear_sky;
    weather.uv=(uv!=null)?uv:null;
    weather.pollen=null;
    renderHeader();
  }catch(e){console.error("Weather error",e);}
}

async function fetchTransit(){
  if(!loc)return;
  const pad=transitRadius===300?0.008:transitRadius===500?0.012:transitRadius===1000?0.018:0.03;
  const minLat=loc.lat-pad, maxLat=loc.lat+pad, minLon=loc.lon-pad, maxLon=loc.lon+pad;
  const q=`{stopPlacesByBbox(minimumLatitude:${minLat},maximumLatitude:${maxLat},minimumLongitude:${minLon},maximumLongitude:${maxLon}){id name latitude longitude estimatedCalls(timeRange:3600,numberOfDepartures:10){expectedDepartureTime destinationDisplay{frontText}serviceJourney{line{publicCode transportMode}}realtime}}}`;
  try{
    const r=await fetchWithTimeout("https://api.entur.io/journey-planner/v3/graphql",{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":"Johans guide-app"},body:JSON.stringify({query:q})},8000);
    const data=await r.json();
    const raw=(data.data?.stopPlacesByBbox||[])
      .filter(s=>s.estimatedCalls?.length&&s.latitude)
      .map(s=>({...s,dist:Math.round(calcDist(loc.lat,loc.lon,s.latitude,s.longitude))}))
      .sort((a,b)=>a.dist-b.dist);
    const all=[];
    raw.forEach(s=>s.estimatedCalls.forEach(c=>all.push({
      stop:s.name,dist:s.dist,time:c.expectedDepartureTime,
      dest:c.destinationDisplay?.frontText,
      line:c.serviceJourney?.line?.publicCode,
      mode:c.serviceJourney?.line?.transportMode
    })));
    all.sort((a,b)=>new Date(a.time)-new Date(b.time));
    const maxStops=transitRadius<=300?3:transitRadius<=500?5:8;
    const filteredStops=raw.filter(s=>s.dist<=transitRadius);
    const nearest=filteredStops.length?filteredStops.slice(0,maxStops):raw.slice(0,3);
    departures=all.filter(d=>nearest.some(s=>s.name===d.stop)).slice(0,40);
    stops=nearest;
    if(curTab==="avg"||curTab==="stopp")renderContent();
  }catch(e){
    console.error("Transit error",e);
    if(curTab==="avg"||curTab==="stopp")setContent(`<div class="errcard"><div class="etitle">Kunne ikke hente avganger</div><div class="ebody">Prøv igjen om litt.</div></div>`);
  }
}

let fetchingRestaurants=false;
let restaurantsFetched=false;
async function fetchRestaurants(){
  if(!loc||fetchingRestaurants||restaurantsFetched)return;
  fetchingRestaurants=true;
  try{
    const fieldMask="places.displayName,places.rating,places.userRatingCount,places.priceLevel,places.currentOpeningHours,places.formattedAddress,places.location,places.primaryTypeDisplayName";
    const body={
      includedTypes:["restaurant","cafe","bar","bakery","meal_takeaway"],
      maxResultCount:15,
      rankPreference:"DISTANCE",
      locationRestriction:{
        circle:{
          center:{latitude:loc.lat,longitude:loc.lon},
          radius:800
        }
      }
    };
    const r=await fetchWithTimeout("https://places.googleapis.com/v1/places:searchNearby",{
      method:"POST",

function formatType(t){
  const map={restaurant:"Restaurant",cafe:"Kafé",fast_food:"Hurtigmat",bar:"Bar",pizza:"Pizza",burger:"Burger",sushi:"Sushi",asian:"Asiatisk",italian:"Italiensk",norwegian:"Norsk",chinese:"Kinesisk",indian:"Indisk",mexican:"Meksikansk",kebab:"Kebab",bakery:"Bakeri"};
  return t.split(";").map(s=>map[s.trim()]||s.trim()).filter(Boolean).join(", ");
}

function calcDist(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}


function parseOH(str){
  if(!str)return null;
  try{
    const days=["Su","Mo","Tu","We","Th","Fr","Sa"];
    const today=days[new Date().getDay()];
    // Handle simple "Mo-Fr 09:00-22:00; Sa-Su 10:00-20:00" format
    const parts=str.split(";").map(s=>s.trim());
    for(const part of parts){
      const m=part.match(/^([A-Za-z,-]+)\s+(\d{2}:\d{2})-(\d{2}:\d{2})$/);
      if(!m)continue;
      const range=m[1];
      // Check if today is in range
      const inRange=range.split(",").some(r=>{
        const dash=r.indexOf("-");
        if(dash===-1)return r.trim()===today;
        const s=days.indexOf(r.slice(0,dash).trim()),e=days.indexOf(r.slice(dash+1).trim());
        const t=days.indexOf(today);
        return s!==-1&&e!==-1&&t>=s&&t<=e;
      });
      if(inRange){
        const now=new Date().getHours()*60+new Date().getMinutes();
        const [oh,om]=m[2].split(":").map(Number);
        const [ch,cm]=m[3].split(":").map(Number);
        return{open:now>=oh*60+om&&now<ch*60+cm,hours:m[2]+"–"+m[3]};
      }
    }
    return null;
  }catch(e){return null;}
}
